! Generated by genconfig.py. Review before pasting into a live switch.
!
hostname SW-FLOOR1
service password-encryption
service timestamps log datetime msec localtime
no ip http server
no ip http secure-server
no ip domain-lookup
ip domain-name hotel.local
!
banner motd ^Authorized access only. All activity is logged.^
!
! ---- VLANs ----
vlan 10
 name Staff
vlan 20
 name Guest_WiFi
vlan 30
 name Cameras
vlan 40
 name Voice
vlan 99
 name Management
vlan 100
 name Native_unused
vlan 999
 name UNUSED_BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
! ---- Interfaces ----
interface range Gi1/0/1 - 6
 description Staff PCs + IP phones
 switchport mode access
 switchport nonegotiate
 switchport access vlan 10
 switchport voice vlan 40
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 storm-control broadcast level 5.00
 ip dhcp snooping limit rate 15
 no shutdown
!
interface range Gi1/0/7 - 10
 description Corridor access points
 switchport mode access
 switchport nonegotiate
 switchport access vlan 20
 spanning-tree portfast
 ip dhcp snooping limit rate 15
 no shutdown
!
interface range Gi1/0/11 - 16
 description IP cameras
 switchport mode access
 switchport nonegotiate
 switchport access vlan 30
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 ip dhcp snooping limit rate 15
 no shutdown
!
interface Gi1/0/24
 description Uplink to core
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 100
 switchport trunk allowed vlan 10,20,30,40,99
 ip dhcp snooping trust
 no shutdown
!
! ---- Unused ports: shut down and parked in the black-hole VLAN ----
interface Gi1/0/17
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
interface Gi1/0/18
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
interface Gi1/0/19
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
interface Gi1/0/20
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
interface Gi1/0/21
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
interface Gi1/0/22
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
interface Gi1/0/23
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
! ---- DHCP snooping (blocks rogue DHCP servers) ----
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40
no ip dhcp snooping information option
!
! ---- Management ----
interface vlan 99
 description MANAGEMENT
 ip address 192.168.99.11 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
ip access-list standard MGMT-ONLY
 permit 192.168.99.0 0.0.0.255
 deny any log
ntp server 192.168.99.1
logging host 192.168.99.20
logging trap warnings
!
! ---- Secure remote access ----
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 5 within 60
username admin privilege 15 secret CHANGE_ME
enable secret CHANGE_ME
line con 0
 login local
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
 access-class MGMT-ONLY in
!
end
